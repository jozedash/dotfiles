# udiskie: automount USB drives under /run/media/$USER/<label>.
# Super+Shift+U unmounts everything (hyprland.lua).
program_options:
  automount: true
  notify: true
  # No tray icon: waybar's custom/usb module shows mounted drives instead,
  # in the bar's icon style, refreshed by this hook on every udiskie event
  tray: false
  # The delay lets udisks finish cleaning up a mount when a drive is pulled out
  event_hook: sh -c 'sleep 1; pkill -RTMIN+10 waybar'
  file_manager: kitty -e yazi
